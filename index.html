===== index.html =====

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elevator Configurator</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="logo-area">
    <div class="logo-title">ELEVATOR CONFIGURATOR</div>
    <div class="logo-sub">THIẾT KẾ THANG MÁY THEO PHONG CÁCH CỦA BẠN</div>
  </div>
  <nav class="top-actions">
    <button>▣<span>Lưu mẫu</span></button>
    <button>▧<span>Tải ảnh</span></button>
    <button>▤<span>Báo giá</span></button>
    <button>♧<span>Chia sẻ</span></button>
  </nav>
  <div class="slogan">Elevate<br><i>A Better Life</i></div>
</header>

<main class="workspace">
  <aside class="rail">
    <button class="rail-item active" data-section="cabin"><b>▥</b><span>Cabin</span></button>
    <button class="rail-item" data-section="floor"><b>▦</b><span>Sàn</span></button>
    <button class="rail-item" data-section="walls"><b>▥</b><span>Vách</span></button>
    <button class="rail-item" data-section="ceiling"><b>⌁</b><span>Trần</span></button>
    <button class="rail-item" data-section="door"><b>▥</b><span>Cửa</span></button>
    <button class="rail-item" data-section="handrail"><b>⌁</b><span>Tay vịn</span></button>
    <button class="rail-item" data-section="cop"><b>▤</b><span>Bảng điều khiển</span></button>
    <button class="rail-item" data-section="lighting"><b>♧</b><span>Ánh sáng</span></button>
    <button class="rail-item" data-section="color"><b>◉</b><span>Màu sắc</span></button>
  </aside>

  <section class="left-panel">
    <div class="panel cabin-panel">
      <div class="panel-heading"><strong>Chọn kiểu cabin</strong><span>⌄</span></div>
      <div id="cabinStyleGrid" class="style-grid"></div>
    </div>
    <div class="panel info-panel">
      <div class="info-title">Thông tin mẫu hiện tại</div>
      <div id="currentInfo"></div>
    </div>
  </section>

  <section class="viewer-column">
    <div class="viewer-wrap">
      <div id="viewer"></div>
      <div id="loading">Đang khởi tạo 3D…</div>
      <div class="viewer-dims"><span>W 1400</span><span>D 1200</span><span>H 2400</span><small>mm</small></div>
    </div>

    <div class="viewer-controls">
      <button id="rotateLeft">‹ <span>Quay trái</span></button>
      <button id="doorToggle">▥ <span id="doorText">Mở cửa</span></button>
      <button id="rotateRight"><span>Quay phải</span> ›</button>
    </div>

    <div id="views" class="view-strip">
      <button class="view-card active" data-view="front"><div class="view-art front"></div><span>Mặt trước</span></button>
      <button class="view-card" data-view="left"><div class="view-art left"></div><span>Mặt trái</span></button>
      <button class="view-card" data-view="right"><div class="view-art right"></div><span>Mặt phải</span></button>
      <button class="view-card" data-view="ceiling"><div class="view-art ceiling"></div><span>Trần</span></button>
      <button class="view-card" data-view="floor"><div class="view-art floor"></div><span>Sàn</span></button>
    </div>
  </section>

  <aside class="right-panel">
    <div class="panel catalog-panel">
      <div class="panel-heading"><strong>Mẫu cabin</strong></div>
      <div class="filters">
        <button class="filter active">Tất cả</button><button class="filter">Inox</button><button class="filter">Kính</button><button class="filter">Gỗ</button><button class="filter">Hoa văn</button>
      </div>
      <div id="cabinCatalog" class="catalog-grid"></div>
    </div>

    <div class="panel action-panel">
      <button class="green-action" id="saveBtn">✓ &nbsp;Lưu cấu hình mẫu</button>
      <button id="quoteBtn">▤ &nbsp; Gửi yêu cầu báo giá</button>
      <button id="imageBtn">▧ &nbsp; Tải hình ảnh</button>
      <button id="shareBtn">♧ &nbsp; Chia sẻ mẫu</button>
      <div class="banner">Nâng tầm<br><i>Không gian sống</i></div>
    </div>
  </aside>
</main>
<div id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
